<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicLab</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js" defer></script>
</head>

<body>
    <header class="header" id="header">

        <div class="header-section-1">
            <button id="backButton">Back to Levels</button>

        </div>

        <div class="header-section-2">
            <div class="startPointsControl">
                <button id="increaseStartPointsButtonTrue">+</button>
                <span id="span1">Start (True)</span>
                <button id="decreaseStartPointsButtonTrue">-</button>
            </div>
            <div class="startPointsControl">
                <button id="increaseStartPointsButtonFalse">+</button>
                <span id="span2">Start (False)</span>
                <button id="decreaseStartPointsButtonFalse">-</button>
            </div>
        </div>

        <div class="header-section-3">
            <h1>LogicLab</h1>
        </div>

        <div class="header-section-4">
            <button id="increaseEndPointsButton">+</button>
            <span id="span3">End</span>
            <button id="decreaseEndPointsButton">-</button>
        </div>
        
        <div class="header-section-5">
            <button id="checkButton">Check Result</button>

        </div>


    </header>


    <main id="mainContent">
        <h2>Welcome to LogicLab!</h2>
        <p></p>

        <p>To begin, click the Start button below.</p>
        <button id="startButton">Start</button>
    </main>
    <main class="popup" id="popup">
        <div>
            <h2 id="popupTitle"></h2>
        </div>
        <div>
            <p id="popupText"></p>
        </div>
        <div>
            <button id="hintButton">Show Hint</button>
            <button id="nextButton">Next Level</button>
        </div>

    </main>
    <main class="inPageViewer" id="inPageViewer">
    </main>
    <footer class="toolbar" id="toolbar">
    </footer>
</body>

</html>
